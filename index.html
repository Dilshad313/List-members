<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💍 വിവാഹ ക്ഷണ ട്രാക്കർ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', 'Noto Sans Malayalam', 'Segoe UI', Tahoma, sans-serif;
}

:root {
  --primary: #d6336c;
  --primary-dark: #a61e4d;
  --primary-light: #ffe3ec;
  --purple: #7048e8;
  --purple-light: #f3f0ff;
  --success: #2f9e44;
  --success-light: #d3f9d8;
  --danger: #e03131;
  --danger-light: #ffe3e3;
  --warning: #f08c00;
  --warning-light: #fff3bf;
  --info: #1971c2;
  --info-light: #e7f5ff;

  --bg: #fef6f9;
  --bg-gradient: linear-gradient(135deg, #fff0f6 0%, #f3f0ff 100%);
  --surface: #ffffff;
  --surface-alt: #f8f5fb;
  --border: #ecdce5;
  --text: #22232b;
  --text-light: #767385;
  --shadow-sm: 0 2px 8px rgba(96, 32, 70, 0.06);
  --shadow: 0 10px 30px rgba(96, 32, 70, 0.1);
  --shadow-lg: 0 20px 50px rgba(96, 32, 70, 0.18);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
}

:root[data-theme="dark"] {
  --bg: #15121b;
  --bg-gradient: linear-gradient(135deg, #1b1522 0%, #241a2e 100%);
  --surface: #211b2a;
  --surface-alt: #2a2234;
  --border: #392f46;
  --text: #f1edf7;
  --text-light: #a79fb8;
  --primary-light: #452233;
  --purple-light: #2c2447;
  --success-light: #173322;
  --danger-light: #3a1f23;
  --warning-light: #3a2e16;
  --info-light: #182a3a;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.3);
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
  --shadow-lg: 0 25px 60px rgba(0,0,0,0.55);
}

body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  padding-bottom: 40px;
}

.container {
  max-width: 1250px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ==================== Topbar ==================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 20px;
  margin-bottom: 24px;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  box-shadow: var(--shadow);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.15rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand .ring {
  font-size: 1.5rem;
}

.brand .sub {
  display: block;
  font-size: 0.72rem;
  font-weight: 400;
  opacity: 0.85;
  letter-spacing: 1px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.conn-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(6px);
  white-space: nowrap;
}

.conn-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e9ecef;
  flex-shrink: 0;
}

.conn-dot.online { background: #69db7c; animation: pulse 2s infinite; }
.conn-dot.offline { background: #ff8787; }
.conn-dot.loading { background: #ffd43b; animation: pulse 1s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
  50% { opacity: 0.5; }
}

.icon-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-size: 1.05rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.32);
  transform: scale(1.08);
}

/* ==================== Stats ==================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 26px;
}

.stat-card {
  position: relative;
  background: var(--surface);
  padding: 18px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
  overflow: hidden;
  transition: transform 0.25s, box-shadow 0.25s;
  border: 1px solid var(--border);
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
}

.stat-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.06;
  background: var(--accent, var(--info));
}

.stat-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  background: var(--accent-light, var(--info-light));
  z-index: 1;
}

.stat-card.total { --accent: var(--info); --accent-light: var(--info-light); }
.stat-card.people { --accent: var(--purple); --accent-light: var(--purple-light); }
.stat-card.families { --accent: var(--primary); --accent-light: var(--primary-light); }
.stat-card.called { --accent: var(--warning); --accent-light: var(--warning-light); }
.stat-card.coming { --accent: var(--success); --accent-light: var(--success-light); }
.stat-card.not-coming { --accent: var(--danger); --accent-light: var(--danger-light); }

.stat-value {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--text);
  z-index: 1;
  line-height: 1.1;
}

.stat-label {
  font-size: 0.78rem;
  color: var(--text-light);
  z-index: 1;
  font-weight: 500;
}

/* ==================== Toolbar ==================== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--surface);
  padding: 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}

.search-wrap {
  position: relative;
  flex: 1 1 220px;
  min-width: 180px;
}

.search-wrap .icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.6;
  pointer-events: none;
}

.search-wrap input {
  width: 100%;
  padding: 11px 14px 11px 36px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 0.9rem;
  background: var(--surface-alt);
  color: var(--text);
}

.toolbar select {
  padding: 11px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 0.85rem;
  background: var(--surface-alt);
  color: var(--text);
  flex: 0 0 auto;
}

.toolbar input:focus,
.toolbar select:focus {
  outline: none;
  border-color: var(--primary);
}

.toolbar-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
  flex-wrap: wrap;
}

.btn {
  padding: 11px 20px;
  border: none;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  box-shadow: 0 4px 14px rgba(214,51,108,0.35);
}

.btn-ghost {
  background: var(--surface-alt);
  color: var(--text);
  border: 2px solid var(--border);
}

.btn-ghost.danger { color: var(--danger); }
.btn-ghost.danger:hover { background: var(--danger-light); border-color: var(--danger); }
.btn-ghost:hover { background: var(--info-light); border-color: var(--info); }

/* ==================== List section ==================== */
.list-section {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  overflow: hidden;
}

.list-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.list-section-header h2 {
  font-size: 1.05rem;
  color: var(--primary-dark);
  font-weight: 700;
}

#countBadge {
  color: var(--text-light);
  font-size: 0.85rem;
  font-weight: 400;
}

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1020px;
}

thead {
  background: var(--surface-alt);
}

th {
  padding: 13px 14px;
  text-align: left;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  font-weight: 700;
  white-space: nowrap;
}

td {
  padding: 13px 14px;
  border-top: 1px solid var(--border);
  font-size: 0.9rem;
  vertical-align: middle;
}

tbody tr {
  transition: background 0.15s;
}

tbody tr:hover { background: var(--surface-alt); }
tbody tr.family-row { background: var(--purple-light); }
tbody tr.family-row:hover { filter: brightness(0.97); }

.name-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.name-text strong { display: block; font-size: 0.92rem; }
.name-text span { font-size: 0.78rem; color: var(--text-light); }

.type-badge, .count-badge, .badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
}

.type-individual { background: var(--info-light); color: var(--info); }
.type-family { background: var(--warning-light); color: var(--warning); }

.count-badge {
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
}

.badge-called { background: var(--warning-light); color: var(--warning); }
.badge-not-called { background: var(--surface-alt); color: var(--text-light); border: 1px solid var(--border); }
.badge-coming { background: var(--success-light); color: var(--success); }
.badge-not-coming { background: var(--danger-light); color: var(--danger); }
.badge-maybe { background: var(--info-light); color: var(--info); }

.action-btn {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  margin-right: 4px;
  transition: transform 0.15s;
}

.action-btn:hover { transform: scale(1.12); }
.edit-btn { background: var(--info-light); color: var(--info); }
.delete-btn { background: var(--danger-light); color: var(--danger); }

/* ==================== Mobile cards ==================== */
.guest-cards { display: none; padding: 10px; }

.guest-card {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 10px;
  animation: fadeIn 0.25s ease;
}

.guest-card.family-row { background: var(--purple-light); }

.guest-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.guest-card .badges-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.guest-card .meta-row {
  font-size: 0.82rem;
  color: var(--text-light);
  margin-bottom: 3px;
}

.guest-card .card-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.guest-card .card-actions .action-btn {
  width: auto;
  padding: 7px 14px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.8rem;
}

/* ==================== Empty / loading ==================== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}

.empty-state .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }
.empty-state.hidden { display: none; }
.empty-state p { margin-bottom: 16px; }

.skeleton-row td {
  padding: 16px 14px;
}

.skeleton-bar {
  height: 14px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--surface-alt) 25%, var(--border) 50%, var(--surface-alt) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.loading-state.hidden { display: none; }

/* ==================== FAB ==================== */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  font-size: 1.6rem;
  box-shadow: 0 8px 24px rgba(214,51,108,0.45);
  cursor: pointer;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.fab:hover { transform: scale(1.08) rotate(90deg); }

/* ==================== Modal ==================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 10, 25, 0.55);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: translateY(24px) scale(0.97);
  transition: transform 0.25s;
}

.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.modal-header h2 {
  font-size: 1.15rem;
  color: var(--primary-dark);
}

.modal-body {
  padding: 22px 24px;
  overflow-y: auto;
}

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

/* Entry Type Toggle */
.type-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  background: var(--surface-alt);
  padding: 6px;
  border-radius: 12px;
}

.type-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: transparent;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-light);
}

.type-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff;
  box-shadow: 0 4px 10px rgba(214,51,108,0.3);
}

.type-btn:not(.active):hover { background: var(--border); color: var(--text); }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.form-group label {
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 0.86rem;
  color: var(--text);
}

.form-group label .optional { color: var(--text-light); font-weight: 400; font-size: 0.78rem; }
.form-group label .required { color: var(--danger); }

.form-group input[type="text"],
.form-group input[type="tel"],
.form-group input[type="number"],
.form-group select,
.form-group textarea {
  padding: 11px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 0.92rem;
  transition: all 0.2s;
  background: var(--surface-alt);
  color: var(--text);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(214,51,108,0.15);
}

.count-input-wrap { display: flex; align-items: center; gap: 8px; }

.count-input-wrap input {
  flex: 1;
  text-align: center;
  font-weight: 700;
  font-size: 1.1rem !important;
}

.count-btn {
  width: 42px;
  height: 42px;
  border: 2px solid var(--border);
  background: var(--surface-alt);
  border-radius: 8px;
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--primary);
  flex-shrink: 0;
}

.count-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: scale(1.05); }
.count-btn:active { transform: scale(0.95); }

.radio-group { display: flex; gap: 10px; flex-wrap: wrap; }

.radio-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--surface-alt);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.84rem;
  border: 2px solid transparent;
  transition: all 0.2s;
}

.radio-label:hover { filter: brightness(0.96); }

.radio-label:has(input:checked) {
  background: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary-dark);
  font-weight: 600;
}

.radio-label.coming:has(input:checked) { background: var(--success-light); border-color: var(--success); color: var(--success); }
.radio-label.not-coming:has(input:checked) { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
.radio-label.maybe:has(input:checked) { background: var(--warning-light); border-color: var(--warning); color: var(--warning); }

/* ==================== Toasts ==================== */
.toast-stack {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 999;
  max-width: 90vw;
}

.toast {
  background: var(--success);
  color: #fff;
  padding: 13px 20px;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  font-weight: 600;
  font-size: 0.88rem;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: toastIn 0.25s ease;
}

.toast.leaving { animation: toastOut 0.2s ease forwards; }
.toast.error { background: var(--danger); }
.toast.info { background: var(--info); }

@keyframes toastIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes toastOut {
  to { transform: translateX(120%); opacity: 0; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==================== Responsive ==================== */
@media (max-width: 860px) {
  .table-wrapper { display: none; }
  .guest-cards { display: block; }
}

@media (max-width: 768px) {
  .container { padding: 0 14px; }
  .brand .sub { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar-actions { margin-left: 0; }
  .toolbar-actions .btn { flex: 1; justify-content: center; }
  .toolbar-actions .btn-primary { display: none; }
  .fab { display: flex; }
  .stat-card { padding: 14px; }
  .stat-value { font-size: 1.3rem; }
  .toast-stack { left: 16px; right: 16px; bottom: 90px; }
  .toast { justify-content: center; }
}
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="ring">💍</span>
      <span>
        വിവാഹ ക്ഷണ ട്രാക്കർ
        <span class="sub">WEDDING INVITATION TRACKER</span>
      </span>
    </div>
    <div class="topbar-right">
      <span class="conn-pill">
        <span class="conn-dot loading" id="connDot"></span>
        <span id="connText">കണക്ട് ചെയ്യുന്നു...</span>
      </span>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" type="button">🌙</button>
    </div>
  </header>

  <div class="container">

    <!-- Stats -->
    <div class="stats-grid">

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">

      <form id="guestForm">

                <option value="സുഹൃത്ത്">സുഹൃത്ത്</option>
                <option value="സഹപ്രവർത്തകൻ">സഹപ്രവർത്തകൻ</option>
                <option value="അയൽക്കാരൻ">അയൽക്കാരൻ</option>
                <option value="കുടുംബം">കുടുംബം</option>

              <label>ക്ഷണം നൽകിയിട്ടുണ്ടോ?</label>

                  <input type="radio" name="invited" value="വിളിച്ചു" checked> വിളിച്ചു
                </label>
                <label class="radio-label">
                  <input type="radio" name="invited" value="വിളിച്ചിട്ടില്ല"> വിളിച്ചിട്ടില്ല
                </label>
              </div>

              <label>വരുമോ?</label>
              <div class="radio-group">
                <label class="radio-label coming">
                  <input type="radio" name="attendance" value="വരും" checked> വരും
                </label>
                <label class="radio-label not-coming">
                  <input type="radio" name="attendance" value="വരില്ല"> വരില്ല
                </label>
                <label class="radio-label maybe">
                  <input type="radio" name="attendance" value="സംശയം"> സംശയം
                </label>

          <div class="form-group">
            <label for="notes">കുറിപ്പുകൾ <span class="optional">(optional)</span></label>
            <textarea id="notes" rows="2" placeholder="അധിക വിവരങ്ങൾ..."></textarea>

          <button type="submit" class="btn btn-primary" id="submitBtn">💾 സേവ് ചെയ്യുക</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn">❌ റദ്ദാക്കുക</button>
        </div>

  </div>

  <div class="toast-stack" id="toastStack"></div>

<script>
// Auto-detects dev vs. production so this file works unmodified in both places:
// locally (served from localhost / 127.0.0.1) it talks to `node server.js`,
// everywhere else (e.g. GitHub Pages) it talks to the deployed Vercel backend.
const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
const API_URL = isLocal
  ? "http://localhost:5000/api"
  : "https://list-members.vercel.app/api";

// ==================== State ====================
let guests = [];
let editMode = false;
let currentType = 'individual';

// ==================== DOM ====================
const form = document.getElementById('guestForm');
const editIdInput = document.getElementById('editId');
const entryTypeInput = document.getElementById('entryType');
const nameMalayalam = document.getElementById('nameMalayalam');
const nameEnglish = document.getElementById('nameEnglish');
const phone = document.getElementById('phone');
const relation = document.getElementById('relation');
const notes = document.getElementById('notes');
const familyCount = document.getElementById('familyCount');
const countGroup = document.getElementById('countGroup');
const labelMalayalam = document.getElementById('labelMalayalam');
const labelEnglish = document.getElementById('labelEnglish');
const formTitle = document.getElementById('formTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const guestTableBody = document.getElementById('guestTableBody');
const guestCards = document.getElementById('guestCards');
const emptyState = document.getElementById('emptyState');
const loadingState = document.getElementById('loadingState');
const searchInput = document.getElementById('searchInput');
const filterSelect = document.getElementById('filterSelect');
const exportBtn = document.getElementById('exportBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const countBadge = document.getElementById('countBadge');
const typeToggle = document.getElementById('typeToggle');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
const themeToggle = document.getElementById('themeToggle');
const modalOverlay = document.getElementById('modalOverlay');
const closeModalBtn = document.getElementById('closeModalBtn');
const addBtn = document.getElementById('addBtn');
const fabAdd = document.getElementById('fabAdd');
const emptyAddBtn = document.getElementById('emptyAddBtn');
const toastStack = document.getElementById('toastStack');

// ==================== Init ====================
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  attachListeners();
  fetchGuests();
  // ഓരോ 10 സെക്കൻഡിലും auto-refresh
  setInterval(fetchGuests, 10000);
});

function attachListeners() {
  form.addEventListener('submit', handleSubmit);
  cancelBtn.addEventListener('click', closeModal);
  searchInput.addEventListener('input', render);
  filterSelect.addEventListener('change', render);
  exportBtn.addEventListener('click', exportCSV);
  clearAllBtn.addEventListener('click', clearAll);
  guestTableBody.addEventListener('click', handleTableClick);
  guestCards.addEventListener('click', handleTableClick);
  themeToggle.addEventListener('click', toggleTheme);

  addBtn.addEventListener('click', () => openModal());
  fabAdd.addEventListener('click', () => openModal());
  emptyAddBtn.addEventListener('click', () => openModal());
  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
  });

  typeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    switchType(btn.dataset.type);
  });

  document.getElementById('increaseBtn').addEventListener('click', () => {
    const val = parseInt(familyCount.value) || 1;
    familyCount.value = val + 1;
  });

  document.getElementById('decreaseBtn').addEventListener('click', () => {
    const val = parseInt(familyCount.value) || 1;
    if (val > 1) familyCount.value = val - 1;
  });

  familyCount.addEventListener('input', () => {
    if (parseInt(familyCount.value) < 1) familyCount.value = 1;
  });
}

// ==================== Theme ====================
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', next); } catch (e) {}
}

// ==================== Modal ====================
function openModal() {
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => nameEnglish.focus(), 150);
}

function closeModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  cancelEdit();
}

// ==================== Connection Status ====================
function setConnStatus(status, text) {
  connDot.className = 'conn-dot ' + status;
  connText.textContent = text;
}

// ==================== API ====================
async function fetchGuests() {
  try {
    const res = await fetch(`${API_URL}/guests`);
    if (!res.ok) throw new Error('Fetch failed');

    guests = await res.json();
    loadingState.classList.add('hidden');
    setConnStatus('online', '✅ കണക്ട് ചെയ്തു');
    render();
  } catch (err) {
    console.error('Fetch error:', err);
    loadingState.classList.add('hidden');
    setConnStatus('offline', '❌ കണക്ഷൻ പ്രശ്നം');
    showToast('ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല!', 'error');
  }
}

async function createGuest(guestData) {
  const res = await fetch(`${API_URL}/guests`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(guestData)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Create failed');
  }
  return res.json();
}

async function updateGuest(id, guestData) {
  const res = await fetch(`${API_URL}/guests/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(guestData)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Update failed');
  }
  return res.json();
}

async function removeGuest(id) {
  const res = await fetch(`${API_URL}/guests/${id}`, { method: 'DELETE' });
  if (!res.ok) throw new Error('Delete failed');
  return res.json();
}

async function removeAllGuests() {
  const res = await fetch(`${API_URL}/guests`, { method: 'DELETE' });
  if (!res.ok) throw new Error('Delete all failed');
  return res.json();
}

// ==================== Type Switch ====================
function switchType(type) {
  currentType = type;
  entryTypeInput.value = type;

  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });

  countGroup.style.display = type === 'family' ? 'flex' : 'none';

  if (type === 'family') {
    labelMalayalam.innerHTML = 'കുടുംബത്തിന്റെ പേര് (മലയാളം) <span class="optional">(optional)</span>';
    labelEnglish.innerHTML = 'Family Name (English) <span class="optional">(optional)</span>';
    nameMalayalam.placeholder = 'ഉദാ: രാജേഷ് കുടുംബം';
    nameEnglish.placeholder = 'e.g: Rajesh Family';
  } else {
    labelMalayalam.innerHTML = 'പേര് (മലയാളം) <span class="optional">(optional)</span>';
    labelEnglish.innerHTML = 'Name (English) <span class="optional">(optional)</span>';
    nameMalayalam.placeholder = 'ഉദാ: രാജേഷ് കുമാർ';
    nameEnglish.placeholder = 'e.g: Rajesh Kumar';
  }
}

// ==================== Form Submit ====================
async function handleSubmit(e) {
  e.preventDefault();

  const invited = document.querySelector('input[name="invited"]:checked').value;
  const attendance = document.querySelector('input[name="attendance"]:checked').value;

  const guestData = {
    type: currentType,
    nameMalayalam: nameMalayalam.value.trim(),
    nameEnglish: nameEnglish.value.trim(),
    phone: phone.value.trim(),
    relation: relation.value,
    invited: invited,
    attendance: attendance,
    notes: notes.value.trim(),
    count: currentType === 'family' ? Math.max(1, parseInt(familyCount.value) || 1) : 1
  };

  if (!guestData.nameMalayalam && !guestData.nameEnglish) {
    showToast('കുറഞ്ഞത് ഒരു പേരെങ്കിലും എഴുതണം!', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ സേവ് ചെയ്യുന്നു...';

  try {
    if (editMode) {
      await updateGuest(editIdInput.value, guestData);
    } else {
      await createGuest(guestData);
    }
    showToast(editMode ? '✏️ അപ്ഡേറ്റ് ചെയ്തു!' : '✅ ചേർത്തു!');
    closeModal();
    await fetchGuests();
  } catch (err) {
    console.error('Save error:', err);
    showToast('സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല!', 'error');
  }

  submitBtn.disabled = false;
  submitBtn.textContent = editMode ? '💾 അപ്ഡേറ്റ് ചെയ്യുക' : '💾 സേവ് ചെയ്യുക';
}

function resetForm() {
  form.reset();
  familyCount.value = 1;
  document.querySelector('input[name="invited"][value="വിളിച്ചു"]').checked = true;
  document.querySelector('input[name="attendance"][value="വരും"]').checked = true;
}

// ==================== Edit / Delete ====================
function handleTableClick(e) {
  const btn = e.target.closest('button');
  if (!btn) return;

  const id = btn.dataset.id;

  if (btn.classList.contains('edit-btn')) {
    startEdit(id);
  } else if (btn.classList.contains('delete-btn')) {
    deleteGuest(id);
  }
}

function startEdit(id) {
  const guest = guests.find(g => g._id === id);
  if (!guest) return;

  editMode = true;
  editIdInput.value = guest._id;

  switchType(guest.type || 'individual');

  nameMalayalam.value = guest.nameMalayalam || '';
  nameEnglish.value = guest.nameEnglish || '';
  phone.value = guest.phone || '';
  relation.value = guest.relation || '';
  notes.value = guest.notes || '';
  familyCount.value = guest.count || 1;

  const invitedEl = document.querySelector(`input[name="invited"][value="${guest.invited}"]`);
  if (invitedEl) invitedEl.checked = true;

  const attEl = document.querySelector(`input[name="attendance"][value="${guest.attendance}"]`);
  if (attEl) attEl.checked = true;

  formTitle.textContent = '✏️ വിവരങ്ങൾ തിരുത്തുക';
  submitBtn.textContent = '💾 അപ്ഡേറ്റ് ചെയ്യുക';

  openModal();
}

function cancelEdit() {
  editMode = false;
  editIdInput.value = '';
  resetForm();
  switchType('individual');
  formTitle.textContent = '➕ പുതിയ എൻട്രി ചേർക്കുക';
  submitBtn.textContent = '💾 സേവ് ചെയ്യുക';
}

async function deleteGuest(id) {
  const guest = guests.find(g => g._id === id);
  if (!guest) return;
  const displayName = guest.nameMalayalam || guest.nameEnglish || 'ഈ എൻട്രി';
  if (!confirm(`"${displayName}" നീക്കം ചെയ്യണോ?`)) return;

  try {
    await removeGuest(id);
    showToast('🗑️ നീക്കം ചെയ്തു', 'info');
    await fetchGuests();
  } catch (err) {
    console.error('Delete error:', err);
    showToast('നീക്കം ചെയ്യാൻ കഴിഞ്ഞില്ല!', 'error');
  }
}

async function clearAll() {
  if (guests.length === 0) return;
  if (!confirm('എല്ലാ വിവരങ്ങളും മായ്ക്കണോ? ഇത് തിരികെ ലഭിക്കില്ല!')) return;

  try {
    await removeAllGuests();
    showToast('🗑️ എല്ലാം മായ്ച്ചു', 'info');
    await fetchGuests();
  } catch (err) {
    console.error('Clear all error:', err);
    showToast('മായ്ക്കാൻ കഴിഞ്ഞില്ല!', 'error');
  }
}

// ==================== Render ====================
function render() {
  const search = searchInput.value.trim().toLowerCase();
  const filter = filterSelect.value;

  const filtered = guests.filter(g => {
    const matchSearch =
      (g.nameMalayalam || '').toLowerCase().includes(search) ||
      (g.nameEnglish || '').toLowerCase().includes(search) ||
      (g.phone || '').toLowerCase().includes(search);

    let matchFilter = true;
    if (filter === 'individual' || filter === 'family') {
      matchFilter = g.type === filter;
    } else if (filter !== 'all') {
      matchFilter = g.invited === filter || g.attendance === filter;
    }

    return matchSearch && matchFilter;
  });

  guestTableBody.innerHTML = '';
  guestCards.innerHTML = '';

  if (filtered.length === 0) {
    emptyState.classList.remove('hidden');
  } else {
    emptyState.classList.add('hidden');
    filtered.forEach((g, idx) => {
      const isFamily = g.type === 'family';
      const countDisplay = isFamily
        ? `<span class="count-badge">👥 ${g.count || 1}</span>`
        : '1';
      const initials = getInitials(g.nameEnglish || g.nameMalayalam);

      const tr = document.createElement('tr');
      if (isFamily) tr.classList.add('family-row');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>
          <span class="type-badge ${isFamily ? 'type-family' : 'type-individual'}">
            ${isFamily ? '🏠 കുടുംബം' : '👤 വ്യക്തി'}
          </span>
        </td>
        <td>
          <div class="name-cell">
            <span class="avatar">${initials}</span>
            <div class="name-text">
              <strong>${escapeHtml(g.nameMalayalam || g.nameEnglish || '-')}</strong>
              ${g.nameMalayalam && g.nameEnglish ? `<span>${escapeHtml(g.nameEnglish)}</span>` : ''}
            </div>
          </div>
        </td>
        <td>${countDisplay}</td>
        <td>${escapeHtml(g.phone || '-')}</td>
        <td>${escapeHtml(g.relation || '-')}</td>
        <td>${invitedBadge(g.invited)}</td>
        <td>${attendanceBadge(g.attendance)}</td>
        <td>${escapeHtml(g.notes || '-')}</td>
        <td>
          <button class="action-btn edit-btn" data-id="${g._id}">✏️</button>
          <button class="action-btn delete-btn" data-id="${g._id}">🗑️</button>
        </td>
      `;
      guestTableBody.appendChild(tr);

      const card = document.createElement('div');
      card.className = 'guest-card' + (isFamily ? ' family-row' : '');
      card.innerHTML = `
        <div class="guest-card-top">
          <div class="name-cell">
            <span class="avatar">${initials}</span>
            <div class="name-text">
              <strong>${escapeHtml(g.nameMalayalam || g.nameEnglish || '-')}</strong>
              ${g.nameMalayalam && g.nameEnglish ? `<span>${escapeHtml(g.nameEnglish)}</span>` : ''}
            </div>
          </div>
          <span class="type-badge ${isFamily ? 'type-family' : 'type-individual'}">
            ${isFamily ? '🏠' : '👤'} ${countDisplay}
          </span>
        </div>
        ${g.phone ? `<div class="meta-row">📞 ${escapeHtml(g.phone)}</div>` : ''}
        ${g.relation ? `<div class="meta-row">🔗 ${escapeHtml(g.relation)}</div>` : ''}
        ${g.notes ? `<div class="meta-row">📝 ${escapeHtml(g.notes)}</div>` : ''}
        <div class="badges-row">
          ${invitedBadge(g.invited)}
          ${attendanceBadge(g.attendance)}
        </div>
        <div class="card-actions">
          <button class="action-btn edit-btn" data-id="${g._id}">✏️ തിരുത്തുക</button>
          <button class="action-btn delete-btn" data-id="${g._id}">🗑️ നീക്കം ചെയ്യുക</button>
        </div>
      `;
      guestCards.appendChild(card);
    });
  }

  countBadge.textContent = `(${filtered.length}/${guests.length})`;
  updateStats();
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  const letters = parts.slice(0, 2).map(p => p[0]).join('');
  return letters.toUpperCase();
}

function invitedBadge(val) {
  if (val === 'വിളിച്ചു') return '<span class="badge badge-called">📞 വിളിച്ചു</span>';
  return '<span class="badge badge-not-called">⏳ വിളിച്ചിട്ടില്ല</span>';
}

function attendanceBadge(val) {
  if (val === 'വരും') return '<span class="badge badge-coming">✅ വരും</span>';
  if (val === 'വരില്ല') return '<span class="badge badge-not-coming">❌ വരില്ല</span>';
  return '<span class="badge badge-maybe">🤔 സംശയം</span>';
}

function updateStats() {
  const totalEntries = guests.length;
  const totalPeople = guests.reduce((sum, g) => sum + (g.count || 1), 0);
  const families = guests.filter(g => g.type === 'family').length;
  const called = guests.filter(g => g.invited === 'വിളിച്ചു').length;
  const comingEntries = guests.filter(g => g.attendance === 'വരും');
  const comingPeople = comingEntries.reduce((sum, g) => sum + (g.count || 1), 0);
  const notComing = guests.filter(g => g.attendance === 'വരില്ല').length;

  animateValue('statTotal', totalEntries);
  animateValue('statPeople', totalPeople);
  animateValue('statFamilies', families);
  animateValue('statCalled', called);
  animateValue('statComing', comingPeople);
  animateValue('statNotComing', notComing);
}

const statCache = {};
function animateValue(id, target) {
  const el = document.getElementById(id);
  const from = statCache[id] || 0;
  statCache[id] = target;
  if (from === target) { el.textContent = target; return; }

  const duration = 400;
  const start = performance.now();
  function step(now) {
    const progress = Math.min((now - start) / duration, 1);
    const value = Math.round(from + (target - from) * progress);
    el.textContent = value;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ==================== Export CSV ====================
function exportCSV() {
  if (guests.length === 0) {
    showToast('ഡാറ്റ ഇല്ല!', 'error');
    return;
  }

  const headers = ['Type', 'പേര് (മലയാളം)', 'Name (English)', 'ആൾക്കാർ', 'ഫോൺ', 'ബന്ധം', 'ക്ഷണം', 'വരുമോ', 'കുറിപ്പ്'];
  const rows = guests.map(g => [
    g.type === 'family' ? 'കുടുംബം' : 'വ്യക്തി',
    g.nameMalayalam || '',
    g.nameEnglish || '',
    g.count || 1,
    g.phone || '',
    g.relation || '',
    g.invited,
    g.attendance,
    g.notes || ''
  ]);

  const csvContent = [headers, ...rows]
    .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wedding_guests_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ CSV ഡൗൺലോഡ് ചെയ്തു');
}

// ==================== Helpers ====================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const TOAST_ICONS = { success: '✅', error: '⚠️', info: 'ℹ️' };

function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `<span>${TOAST_ICONS[type] || ''}</span><span>${escapeHtml(msg)}</span>`;
  toastStack.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 200);
  }, 2800);
}
</script>
